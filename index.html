<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Church Cameras">
<meta name="theme-color" content="#111111">
<title>Church Cameras</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f1f3f6;
  color:#111827;
}
body{padding:18px}
.app{width:100%;max-width:1500px;margin:auto}

/* HEADER */
.header{display:flex;align-items:center;gap:14px;margin:0 8px 18px}
.header-icon{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center}
.header-icon svg{width:54px;height:54px;stroke:#111827;fill:none}
.header-text h1{margin:0;font-size:34px;line-height:1;font-weight:800;letter-spacing:-.8px}
.header-text p{margin:5px 0 0;font-size:17px;font-weight:600;color:#5f6875}

/* CAMERA CARDS */
.camera-container{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.camera{
  background:#fff;border:1px solid #e2e6eb;border-radius:18px;padding:18px;
  box-shadow:0 5px 18px rgba(20,30,45,.09);min-width:0;
}
.camera-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.camera-title h2{margin:0;font-size:25px;line-height:1.05;font-weight:800;letter-spacing:-.4px}
.ip{margin-top:5px;color:#697383;font-size:15px;line-height:1}

/* ONLINE INDICATOR */
.online{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  background:#d9f4e1;color:#123d22;font-size:14px;font-weight:750;white-space:nowrap;
}
.online-dot{width:9px;height:9px;border-radius:50%;background:#18a957}
.online.offline{background:#fde1e1;color:#651c1c}
.online.offline .online-dot{background:#df3f3f}

/* PREVIEW */
.preview-wrap{
  width:100%;aspect-ratio:16/9;background:#101318;border:3px solid #171c24;border-radius:12px;
  overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.16);margin-bottom:13px;
}
.preview{display:block;width:100%;height:100%;object-fit:contain;background:#101318}

/* COLUMNS */
.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.column{display:flex;flex-direction:column;gap:6px;min-width:0}
.column-label{
  height:43px;display:flex;align-items:center;justify-content:center;border-radius:11px 11px 7px 7px;
  color:#fff;font-size:17px;font-weight:800;letter-spacing:.2px;
}
.column-label.left{background:#2f89df}
.column-label.center{background:#25a95d}
.column-label.right{background:#e65353}

/* PRESET BUTTONS */
.preset{
  position:relative;width:100%;min-height:76px;border-radius:11px;color:#111827;cursor:pointer;
  padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:left;
  font-family:inherit;box-shadow:0 2px 5px rgba(20,30,45,.10);
  transition:transform .08s ease,filter .08s ease,box-shadow .08s ease;
}
.preset:active{transform:scale(.975);filter:brightness(.96)}
.preset:hover{box-shadow:0 3px 7px rgba(20,30,45,.14)}
.preset.left{background:#dcebff;border:2px solid #58a7f5}
.preset.center{background:#dff6e6;border:2px solid #42b86b}
.preset.right{background:#ffe0e0;border:2px solid #ef6262}

.preset-icon{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center}
.preset-icon svg{
  width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.preset-text{min-width:0;flex:1}
.preset-name{display:block;font-size:14px;line-height:1.12;font-weight:800}
.number{display:block;margin-top:4px;color:#4d5968;font-size:11px;line-height:1;font-weight:550}

/* STATUS */
.status{
  min-height:38px;margin-top:12px;border-radius:10px;background:#e9edf2;display:flex;
  align-items:center;justify-content:center;text-align:center;color:#5d6775;font-size:14px;font-weight:600;
}
.footer{text-align:center;color:#7a8492;font-size:12px;margin-top:12px}


/* TABLET / IPAD */
@media (min-width:800px) and (max-width:1199px){
  body{padding:12px}
  .header{margin:0 6px 12px}
  .header-icon{width:48px;height:48px;flex-basis:48px}
  .header-icon svg{width:46px;height:46px}
  .header-text h1{font-size:28px}
  .header-text p{font-size:14px}
  .camera-container{gap:10px}
  .camera{padding:12px;border-radius:15px}
  .camera-title h2{font-size:20px}
  .ip{font-size:12px}
  .online{padding:6px 10px;font-size:12px}
  .column-label{height:36px;font-size:14px}
  .preset{min-height:67px;padding:7px 5px}
  .preset-icon{width:25px;height:25px;flex-basis:25px}
  .preset-icon svg{width:23px;height:23px}
  .preset-name{font-size:12px}
  .number{font-size:9px}
  .status{min-height:31px;font-size:11px}
}


/* DESKTOP + TABLET: FIT TO SCREEN, NO SCROLL
   The camera preview takes whatever height is left over. */
@media (min-width:800px){
  html,body{height:100%;overflow:hidden}
  body{padding:clamp(8px,1.6vh,18px)}

  .app{height:100%;display:flex;flex-direction:column}

  .header{flex:0 0 auto;margin:0 6px clamp(6px,1.2vh,14px)}
  .header-icon{
    width:clamp(34px,6vh,54px);height:clamp(34px,6vh,54px);flex-basis:clamp(34px,6vh,54px);
  }
  .header-icon svg{width:100%;height:100%}
  .header-text h1{font-size:clamp(20px,4vh,32px)}
  .header-text p{font-size:clamp(11px,1.9vh,16px);margin-top:3px}

  .camera-container{
    flex:1 1 0;min-height:0;
    grid-template-rows:minmax(0,1fr);
    gap:clamp(8px,1.4vh,16px);
  }
  .camera{
    display:flex;flex-direction:column;min-height:0;
    padding:clamp(8px,1.5vh,16px);
  }
  .camera-top{flex:0 0 auto;margin-bottom:clamp(6px,1vh,10px)}
  .camera-title h2{font-size:clamp(16px,2.8vh,24px)}
  .ip{margin-top:3px;font-size:clamp(11px,1.8vh,14px)}
  .online{padding:clamp(4px,.8vh,7px) 11px;font-size:clamp(11px,1.7vh,14px)}

  .preview-wrap{
    flex:1 1 0;min-height:60px;aspect-ratio:auto;margin-bottom:clamp(6px,1.2vh,12px);
  }

  .columns{flex:0 0 auto;gap:clamp(6px,1vh,10px)}
  .column{gap:clamp(4px,.7vh,6px)}
  .column-label{height:clamp(26px,4.2vh,40px);font-size:clamp(12px,1.9vh,16px)}
  .preset{min-height:clamp(46px,7.4vh,68px);padding:4px 6px}
  .preset-name{font-size:clamp(12px,1.9vh,14px)}
  .number{font-size:clamp(9px,1.4vh,11px);margin-top:3px}

  .status{
    flex:0 0 auto;min-height:clamp(24px,3.8vh,34px);margin-top:clamp(6px,1vh,10px);
    font-size:clamp(11px,1.7vh,14px);
  }
  .footer{display:none}
}


/* IPHONE PORTRAIT */
@media (max-width:799px) and (orientation:portrait){
  html,body{width:100%;height:100%;overflow:hidden}
  body{padding:7px 6px}
  .app{width:100%;max-width:none;height:100%;display:flex;flex-direction:column}
  .header{flex:0 0 auto;margin:0 3px 6px;gap:7px}
  .header-icon{width:35px;height:35px;flex-basis:35px}
  .header-icon svg{width:34px;height:34px}
  .header-text h1{font-size:20px;letter-spacing:-.4px}
  .header-text p{font-size:10px;margin-top:2px}
  .camera-container{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
  .camera{flex:1 1 auto;min-height:0;padding:6px;border-radius:10px;display:flex;flex-direction:column}
  .camera-top{margin-bottom:4px}
  .camera-title h2{font-size:14px;letter-spacing:-.2px}
  .ip{margin-top:2px;font-size:8px}
  .online{padding:4px 7px;gap:4px;font-size:8px}
  .online-dot{width:6px;height:6px}
  .preview-wrap{flex:1 1 0;min-height:0;width:100%;max-width:none;aspect-ratio:auto;margin:0 0 4px;border-width:2px;border-radius:6px}
  .columns{flex:0 0 auto;gap:3px}
  .column{gap:3px}
  .column-label{height:22px;border-radius:6px 6px 4px 4px;font-size:9px}
  .preset{flex:0 0 auto;min-height:0;height:54px;padding:4px 3px;border-radius:8px;gap:3px}
  .preset-icon{width:23px;height:23px;flex-basis:23px}
  .preset-icon svg{width:22px;height:22px}
  .preset-text{text-align:center}
  .preset-name{font-size:10px;line-height:1.1}
  .number{display:none}
  .status{flex:0 0 auto;min-height:15px;height:15px;margin-top:3px;border-radius:5px;font-size:7px}
  .footer{display:none}
}


/* IPHONE LANDSCAPE */
@media (max-width:799px) and (orientation:landscape){
  html,body{width:100%;height:100%;overflow:hidden}
  body{padding:3px}
  .app{width:100%;height:calc(100dvh - 6px);max-width:none;display:flex;flex-direction:column}
  .header{flex:0 0 auto;margin:0 3px 3px;gap:5px}
  .header-icon{width:27px;height:27px;flex-basis:27px}
  .header-icon svg{width:26px;height:26px}
  .header-text h1{font-size:14px;letter-spacing:-.2px}
  .header-text p{display:none}
  .camera-container{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .camera{min-width:0;min-height:0;height:100%;padding:3px;border-radius:7px;display:flex;flex-direction:column;overflow:hidden}
  .camera-top{margin-bottom:2px}
  .camera-title h2{font-size:10px;line-height:1}
  .ip{margin-top:1px;font-size:6px}
  .online{padding:3px 5px;gap:3px;font-size:6px}
  .online-dot{width:5px;height:5px}
  .preview-wrap{flex:0 0 auto;width:30%;max-width:115px;margin:0 auto 2px;border-width:1px;border-radius:4px}
  .columns{flex:1;min-height:0;gap:2px}
  .column{gap:2px}
  .column-label{height:17px;border-radius:4px 4px 2px 2px;font-size:7px}
  .preset{flex:1;min-height:0;padding:1px;border-radius:4px;gap:1px}
  .preset-icon{width:13px;height:13px;flex-basis:13px}
  .preset-icon svg{width:12px;height:12px}
  .preset-text{text-align:center}
  .preset-name{font-size:7px;line-height:1}
  .number{display:none}
  .status{flex:0 0 auto;min-height:7px;height:7px;margin-top:2px;border-radius:3px;font-size:6px}
  .footer{display:none}
}


/* HOME SCREEN APP TOP SPACE */
@media (max-width:799px) and (orientation:portrait) and (display-mode:standalone){
  body{padding-top:18px}
}
</style>
</head>

<body>

<!-- ICON DEFINITIONS (defined once, reused below) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <!-- Church: cross on the steeple, side wings, arched door -->
  <symbol id="i-church" viewBox="0 0 64 64">
    <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M32 4v15"/>
      <path d="M25.5 11h13"/>
      <path d="M7 39L32 19l25 20"/>
      <path d="M12 35v23"/>
      <path d="M52 35v23"/>
      <path d="M5 58h54"/>
      <path d="M24 58V43h16v15"/>
    </g>
  </symbol>

  <!-- Altar: cross standing above an altar table -->
  <symbol id="i-altar" viewBox="0 0 32 32">
    <path d="M16 3v11"/>
    <path d="M12 7h8"/>
    <path d="M5 18h22"/>
    <path d="M8 18v9"/>
    <path d="M24 18v9"/>
    <path d="M5 27h22"/>
  </symbol>

  <!-- Gospel: open book -->
  <symbol id="i-gospel" viewBox="0 0 32 32">
    <path d="M4 7c4-3 8-3 12 0v20c-4-3-8-3-12 0V7Z"/>
    <path d="M28 7c-4-3-8-3-12 0v20c4-3 8-3 12 0V7Z"/>
    <path d="M16 8v19"/>
  </symbol>

  <!-- Sermon: microphone -->
  <symbol id="i-sermon" viewBox="0 0 32 32">
    <rect x="12" y="5" width="8" height="15" rx="4"/>
    <path d="M8 15a8 8 0 0 0 16 0"/>
    <path d="M16 23v5"/>
    <path d="M11 28h10"/>
  </symbol>

</svg>

<div class="app">

<header class="header">
  <div class="header-icon" aria-hidden="true">
    <svg><use href="#i-church"/></svg>
  </div>
  <div class="header-text">
    <h1>Church Cameras</h1>
    <p>Panasonic PTZ Camera Control</p>
  </div>
</header>

<div class="camera-container">

<!-- NEW CHURCH CAMERA -->
<section class="camera">
  <div class="camera-top">
    <div class="camera-title">
      <h2>New Church Camera</h2>
      <div class="ip">192.168.10.30</div>
    </div>
    <div id="new-online" class="online">
      <span class="online-dot"></span><span>Online</span>
    </div>
  </div>

  <div class="preview-wrap">
    <img class="preview" id="new-preview" alt="New Church Camera live view">
  </div>

  <div class="columns">

    <div class="column">
      <div class="column-label left">Left</div>

      <button class="preset left" onclick="recall('new',10)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-altar"/></svg></span>
        <span class="preset-text"><span class="preset-name">Altar</span><span class="number">Preset 10</span></span>
      </button>

      <button class="preset left" onclick="recall('new',16)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-gospel"/></svg></span>
        <span class="preset-text"><span class="preset-name">Gospel</span><span class="number">Preset 16</span></span>
      </button>

      <button class="preset left" onclick="recall('new',13)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-sermon"/></svg></span>
        <span class="preset-text"><span class="preset-name">Sermon</span><span class="number">Preset 13</span></span>
      </button>
    </div>

    <div class="column">
      <div class="column-label center">Center</div>

      <button class="preset center" onclick="recall('new',5)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-altar"/></svg></span>
        <span class="preset-text"><span class="preset-name">Altar</span><span class="number">Preset 5</span></span>
      </button>

      <button class="preset center" onclick="recall('new',9)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-gospel"/></svg></span>
        <span class="preset-text"><span class="preset-name">Gospel</span><span class="number">Preset 9</span></span>
      </button>

      <button class="preset center" onclick="recall('new',1)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-sermon"/></svg></span>
        <span class="preset-text"><span class="preset-name">Sermon</span><span class="number">Preset 1</span></span>
      </button>
    </div>

    <div class="column">
      <div class="column-label right">Right</div>

      <button class="preset right" onclick="recall('new',11)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-altar"/></svg></span>
        <span class="preset-text"><span class="preset-name">Altar</span><span class="number">Preset 11</span></span>
      </button>
    </div>

  </div>

  <div id="new-status" class="status">Ready</div>
</section>


<!-- OLD CHURCH CAMERA -->
<section class="camera">
  <div class="camera-top">
    <div class="camera-title">
      <h2>Old Church Camera</h2>
      <div class="ip">192.168.10.28</div>
    </div>
    <div id="old-online" class="online">
      <span class="online-dot"></span><span>Online</span>
    </div>
  </div>

  <div class="preview-wrap">
    <img class="preview" id="old-preview" alt="Old Church Camera live view">
  </div>

  <div class="columns">

    <div class="column">
      <div class="column-label left">Left</div>
      <button class="preset left" onclick="recall('old',4)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-altar"/></svg></span>
        <span class="preset-text"><span class="preset-name">Altar</span><span class="number">Preset 4</span></span>
      </button>
    </div>

    <div class="column">
      <div class="column-label center">Center</div>
      <button class="preset center" onclick="recall('old',9)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-gospel"/></svg></span>
        <span class="preset-text"><span class="preset-name">Gospel</span><span class="number">Preset 9</span></span>
      </button>
    </div>

    <div class="column">
      <div class="column-label right">Right</div>
      <button class="preset right" onclick="recall('old',1)">
        <span class="preset-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-sermon"/></svg></span>
        <span class="preset-text"><span class="preset-name">Sermon</span><span class="number">Preset 1</span></span>
      </button>
    </div>

  </div>

  <div id="old-status" class="status">Ready</div>
</section>

</div>

<div class="footer">Panasonic PTZ Camera Control</div>

</div>


<script>

/* CAMERA CONFIGURATION */
const cameras = {
  new:{ ip:"192.168.10.30", status:"new-status", online:"new-online" },
  old:{ ip:"192.168.10.28", status:"old-status", online:"old-online" }
};

/* PREVIEW CONFIGURATION */
const previewFeeds = {
  new:{ ip:"192.168.10.30", element:"new-preview" },
  old:{ ip:"192.168.10.28", element:"old-preview" }
};

/* ONLINE STATUS */
function setOnline(which,isOnline){
  const el = document.getElementById(cameras[which].online);
  el.classList.toggle("offline",!isOnline);
  el.querySelector("span:last-child").textContent = isOnline ? "Online" : "Offline";
}

/* REFRESH CAMERA PREVIEW */
function refreshPreview(which){
  const feed = previewFeeds[which];
  const img = document.getElementById(feed.element);
  const test = new Image();

  test.onload = () => {
    setOnline(which,true);
    img.src = test.src;
  };

  test.onerror = () => {
    setOnline(which,false);
  };

  test.src = `http://${feed.ip}/cgi-bin/camera?resolution=640x360&quality=standard&${Date.now()}`;
}

/* START PREVIEWS */
function startPreviews(){
  Object.keys(previewFeeds).forEach(which => {
    refreshPreview(which);
    setInterval(() => refreshPreview(which),1000);
  });
}
startPreviews();

/* PRESET RECALL */
function recall(which,n){
  const cam = cameras[which];
  const code = String(n - 1).padStart(2,"0");
  const url = `http://${cam.ip}/cgi-bin/aw_ptz?cmd=%23R${code}&res=1`;
  const statusEl = document.getElementById(cam.status);

  statusEl.textContent = `Calling preset ${n}...`;

  const img = new Image();
  img.onload = () => { statusEl.textContent = `Preset ${n} sent.`; };
  img.onerror = () => { statusEl.textContent = `Preset ${n} sent.`; };
  img.src = url + `&t=${Date.now()}`;
}

</script>

</body>
