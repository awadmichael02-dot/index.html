<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1,
               viewport-fit=cover">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Church Cameras">
<meta name="theme-color" content="#111111">

<title>Church Cameras</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f3f3;
}

body{
  padding:16px;
}

.app{
  width:100%;
  max-width:1400px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:30px;
  margin:0 0 18px;
}

.camera-container{
  display:block;
}

.camera{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 2px 9px rgba(0,0,0,.10);
}

.camera h2{
  text-align:center;
  margin:0 0 3px;
  font-size:25px;
}

.ip{
  text-align:center;
  color:#666;
  font-size:14px;
  margin-bottom:15px;
}


/* =========================================================
   CAMERA PREVIEW
   ========================================================= */

.preview-wrap{
  width:75%;
  max-width:560px;
  margin:0 auto 14px;
  background:#111;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.preview{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:contain;
  background:#111;
}

.preview-note{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:6px;
}


/* =========================================================
   PRESET BUTTONS
   ========================================================= */

.columns{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  align-items:start;
}

.column{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.preset{
  border:0;
  border-radius:15px;
  color:#111;
  font-size:17px;
  font-weight:700;
  min-height:88px;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
  cursor:pointer;
  padding:12px;
  transition:transform .08s ease,filter .08s ease;
}

.preset:active{
  transform:scale(.97);
  filter:brightness(.94);
}

.number{
  display:block;
  font-size:12px;
  color:#555;
  font-weight:500;
  margin-top:6px;
}


/* LEFT = BLUE */

.left{
  background:#dceeff;
  border:2px solid #4da3ff;
}

.left:hover{
  background:#cde7ff;
}


/* CENTER = GREEN */

.center{
  background:#dcf7e5;
  border:2px solid #42b86b;
}

.center:hover{
  background:#cef0da;
}


/* RIGHT = RED */

.right{
  background:#ffe0e0;
  border:2px solid #ef6262;
}

.right:hover{
  background:#ffd2d2;
}


/* =========================================================
   STATUS / FOOTER
   ========================================================= */

.status{
  text-align:center;
  min-height:21px;
  margin-top:12px;
  color:#666;
  font-size:14px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:8px;
}


/* =========================================================
   IPHONE PORTRAIT
   ========================================================= */

@media (max-width:799px)
       and (orientation:portrait){

  html,
  body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    padding:8px 6px 6px;
  }

  .app{
    width:100%;
    max-width:none;
  }

  h1{
    font-size:21px;
    line-height:1;
    margin:0 0 7px;
  }

  .camera{
    width:100%;
    padding:8px;
    margin:0 0 7px;
    border-radius:12px;
  }

  .camera h2{
    font-size:16px;
    line-height:1;
    margin:0 0 2px;
  }

  .ip{
    font-size:9px;
    line-height:1;
    margin-bottom:3px;
  }

  .preview-wrap{
    width:50%;
    max-width:240px;
    margin:0 auto 4px;
    border-radius:7px;
  }

  .preview{
    width:100%;
    aspect-ratio:16/9;
    height:auto;
  }

  .preview-note{
    display:none;
  }

  .columns{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }

  .column{
    gap:5px;
  }

  .preset{
    min-height:0;
    height:50px;
    padding:3px;
    border-radius:8px;
    font-size:12px;
    line-height:1.05;
  }

  .number{
    display:none;
  }

  .status{
    min-height:11px;
    height:11px;
    margin-top:3px;
    font-size:9px;
    line-height:1;
  }

  .footer{
    display:none;
  }
}


/* =========================================================
   IPHONE PORTRAIT — STANDALONE HOME SCREEN APP
   ========================================================= */

@media (max-width:799px)
       and (orientation:portrait)
       and (display-mode:standalone){

  body{
    padding-top:20px;
  }
}


/* =========================================================
   IPHONE LANDSCAPE — ULTRA COMPACT
   ========================================================= */

@media (max-width:799px) and (orientation:landscape){

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    padding:3px;
  }

  .app{
    width:100%;
    height:calc(100dvh - 6px);
    max-width:none;
    display:flex;
    flex-direction:column;
  }

  h1{
    flex:0 0 auto;
    font-size:15px;
    line-height:1;
    margin:0 0 3px;
  }

  .camera-container{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
  }

  .camera{
    min-width:0;
    min-height:0;
    height:100%;
    margin:0;
    padding:3px;
    border-radius:7px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .camera h2{
    flex:0 0 auto;
    font-size:11px;
    line-height:1;
    margin:0 0 1px;
  }

  .ip{
    flex:0 0 auto;
    font-size:7px;
    line-height:1;
    margin-bottom:1px;
  }

  .preview-wrap{
    flex:0 0 auto;
    width:30%;
    max-width:120px;
    margin:0 auto 1px;
    border-radius:4px;
  }

  .preview{
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    display:block;
  }

  .preview-note{
    display:none;
  }

  .columns{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
  }

  .column{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-height:0;
  }

  .preset{
    flex:1;
    min-height:0;
    height:auto;
    padding:1px;
    border-radius:4px;
    font-size:8px;
    line-height:1;
  }

  .number{
    display:none;
  }

  .status{
    flex:0 0 auto;
    min-height:7px;
    height:7px;
    margin-top:1px;
    font-size:7px;
    line-height:1;
  }

  .footer{
    display:none;
  }
}


/* =========================================================
   IPAD / LARGE TABLET LANDSCAPE
   ========================================================= */

@media (min-width:800px)
       and (orientation:landscape){

  html,
  body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    padding:8px;
  }

  .app{
    width:100%;
    height:calc(100dvh - 16px);
    max-width:1500px;
    margin:auto;
    display:flex;
    flex-direction:column;
  }

  h1{
    flex:0 0 auto;
    font-size:24px;
    line-height:1;
    margin:0 0 6px;
  }

  .camera-container{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .camera{
    min-width:0;
    min-height:0;
    height:100%;
    margin:0;
    padding:9px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-radius:14px;
  }

  .camera h2{
    flex:0 0 auto;
    font-size:20px;
    line-height:1;
    margin:0 0 2px;
  }

  .ip{
    flex:0 0 auto;
    font-size:11px;
    line-height:1;
    margin-bottom:4px;
  }

  .preview-wrap{
    flex:0 0 auto;
    width:55%;
    max-width:420px;
    margin:0 auto 3px;
    border-radius:9px;
  }

  .preview{
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    object-fit:contain;
  }

  .preview-note{
    flex:0 0 auto;
    font-size:10px;
    margin:0 0 4px;
  }

  .columns{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }

  .column{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-height:0;
  }

  .preset{
    flex:1;
    min-height:0;
    height:auto;
    padding:4px;
    border-radius:9px;
    font-size:13px;
    line-height:1.05;
  }

  .number{
    font-size:9px;
    margin-top:2px;
  }

  .status{
    flex:0 0 auto;
    min-height:14px;
    height:14px;
    margin-top:3px;
    font-size:10px;
    line-height:1;
  }

  .footer{
    display:none;
  }
}


/* =========================================================
   LARGE COMPUTER LANDSCAPE
   ========================================================= */

@media (min-width:1200px)
       and (orientation:landscape){

  .app{
    max-width:1500px;
  }

  h1{
    font-size:28px;
  }

  .camera{
    padding:14px;
  }

  .camera h2{
    font-size:23px;
  }

  .preview-wrap{
    width:55%;
    max-width:500px;
  }

  .preset{
    font-size:15px;
  }
}

</style>
</head>


<body>

<div class="app">

<h1>Church Cameras</h1>

<div class="camera-container">


<!-- =====================================================
     NEW CHURCH CAMERA
     ===================================================== -->

<section class="camera">

<h2>New Church Camera</h2>

<div class="ip">
192.168.10.30
</div>

<div class="preview-wrap">

<img
  class="preview"
  id="new-preview"
  alt="New Church Camera live view">

</div>

<div class="preview-note">
Live preview
</div>


<div class="columns">


<!-- LEFT PRESETS -->

<div class="column">

<button
  class="preset left"
  onclick="recall('new',10)">
  Left Altar
  <span class="number">Preset 10</span>
</button>

<button
  class="preset left"
  onclick="recall('new',16)">
  Left Altar Gospel
  <span class="number">Preset 16</span>
</button>

<button
  class="preset left"
  onclick="recall('new',13)">
  Left Altar Sermon
  <span class="number">Preset 13</span>
</button>

</div>


<!-- CENTER PRESETS -->

<div class="column">

<button
  class="preset center"
  onclick="recall('new',5)">
  Main Altar
  <span class="number">Preset 5</span>
</button>

<button
  class="preset center"
  onclick="recall('new',9)">
  Main Gospel
  <span class="number">Preset 9</span>
</button>

<button
  class="preset center"
  onclick="recall('new',1)">
  Main Altar Sermon
  <span class="number">Preset 1</span>
</button>

</div>


<!-- RIGHT PRESETS -->

<div class="column">

<button
  class="preset right"
  onclick="recall('new',11)">
  Right Altar
  <span class="number">Preset 11</span>
</button>

</div>

</div>


<div id="new-status" class="status">
Ready
</div>

</section>


<!-- =====================================================
     OLD CHURCH CAMERA
     ===================================================== -->

<section class="camera">

<h2>Old Church Camera</h2>

<div class="ip">
192.168.10.28
</div>

<div class="preview-wrap">

<img
  class="preview"
  id="old-preview"
  alt="Old Church Camera live view">

</div>

<div class="preview-note">
Live preview
</div>


<div class="columns">


<!-- LEFT -->

<div class="column">

<button
  class="preset left"
  onclick="recall('old',4)">
  Main
  <span class="number">Preset 4</span>
</button>

</div>


<!-- CENTER -->

<div class="column">

<button
  class="preset center"
  onclick="recall('old',9)">
  Gospel
  <span class="number">Preset 9</span>
</button>

</div>


<!-- RIGHT -->

<div class="column">

<button
  class="preset right"
  onclick="recall('old',1)">
  Sermon
  <span class="number">Preset 1</span>
</button>

</div>

</div>


<div id="old-status" class="status">
Ready
</div>

</section>

</div>


<div class="footer">
Panasonic PTZ Camera Control
</div>

</div>


<script>

/* =========================================================
   CAMERA CONFIGURATION
   ========================================================= */

const cameras = {

  new:{
    ip:"192.168.10.30",
    status:"new-status"
  },

  old:{
    ip:"192.168.10.28",
    status:"old-status"
  }

};


/* =========================================================
   PREVIEW CONFIGURATION
   ========================================================= */

const previewFeeds = {

  new:{
    ip:"192.168.10.30",
    element:"new-preview"
  },

  old:{
    ip:"192.168.10.28",
    element:"old-preview"
  }

};


/* =========================================================
   REFRESH CAMERA PREVIEW
   ========================================================= */

function refreshPreview(which){

  const feed = previewFeeds[which];

  const img =
    document.getElementById(feed.element);

  img.src =
    `http://${feed.ip}/cgi-bin/camera?resolution=640x360&quality=standard&${Date.now()}`;
}


/* =========================================================
   START PREVIEWS
   ========================================================= */

function startPreviews(){

  Object.keys(previewFeeds).forEach(which => {

    refreshPreview(which);

    setInterval(
      () => refreshPreview(which),
      1000
    );

  });

}

startPreviews();


/* =========================================================
   PRESET RECALL
   ========================================================= */

function recall(which,n){

  const cam = cameras[which];

  const code =
    String(n - 1).padStart(2,"0");

  const url =
    `http://${cam.ip}/cgi-bin/aw_ptz?cmd=%23R${code}&res=1`;

  document.getElementById(
    cam.status
  ).textContent =
    `Calling preset ${n}...`;

  const img = new Image();

  img.onload = () => {

    document.getElementById(
      cam.status
    ).textContent =
      `Preset ${n} sent.`;

  };

  img.onerror = () => {

    document.getElementById(
      cam.status
    ).textContent =
      `Preset ${n} sent.`;

  };

  img.src =
    url +
    `&t=${Date.now()}`;

}

</script>

</body>
</html>
