<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1,
               viewport-fit=cover">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Church Cameras">
<meta name="theme-color" content="#111111">

<title>Church Cameras</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f1f3f6;
  color:#111827;
}

body{
  padding:18px;
}

.app{
  width:100%;
  max-width:1500px;
  margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin:0 8px 18px;
}

.header-icon{
  width:58px;
  height:58px;
  flex:0 0 58px;
  display:grid;
  place-items:center;
}

.header-icon img{
  width:64px;
  height:64px;
  object-fit:contain;
}

.header-text h1{
  margin:0;
  font-size:34px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.8px;
}

.header-text p{
  margin:5px 0 0;
  font-size:17px;
  font-weight:600;
  color:#5f6875;
}

/* =========================
   CAMERA CONTAINER
========================= */

.camera-container{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.camera{
  background:#fff;
  border:1px solid #e2e6eb;
  border-radius:18px;
  padding:18px;
  box-shadow:0 5px 18px rgba(20,30,45,.09);
  min-width:0;
}

/* =========================
   CAMERA HEADER
========================= */

.camera-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.camera-title h2{
  margin:0;
  font-size:25px;
  line-height:1.05;
  font-weight:800;
  letter-spacing:-.4px;
}

.ip{
  margin-top:5px;
  color:#697383;
  font-size:15px;
  line-height:1;
}

/* =========================
   ONLINE STATUS
========================= */

.online{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 13px;
  border-radius:999px;
  background:#d9f4e1;
  color:#123d22;
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#18a957;
}

.online.offline{
  background:#fde1e1;
  color:#651c1c;
}

.online.offline .online-dot{
  background:#df3f3f;
}

/* =========================
   CAMERA PREVIEW
========================= */

.preview-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#101318;
  border:3px solid #171c24;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.16);
  margin-bottom:13px;
}

.preview{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#101318;
}

.preview-note{
  display:none;
}

/* =========================
   NEW CAMERA COLUMNS
========================= */

.columns{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  align-items:start;
}

.column{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
}

.column-label{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px 11px 7px 7px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  letter-spacing:.2px;
}

.column-label.left{
  background:#2f89df;
}

.column-label.center{
  background:#25a95d;
}

.column-label.right{
  background:#e65353;
}

/* =========================
   PRESET BUTTONS
========================= */

.preset{
  position:relative;
  width:100%;
  min-height:76px;
  border-radius:11px;
  color:#111827;
  cursor:pointer;
  padding:10px 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-align:left;
  font-family:inherit;
  box-shadow:0 2px 5px rgba(20,30,45,.10);
  transition:
    transform .08s ease,
    filter .08s ease,
    box-shadow .08s ease;
}

.preset:active{
  transform:scale(.975);
  filter:brightness(.96);
}

.preset:hover{
  box-shadow:0 3px 7px rgba(20,30,45,.14);
}

.preset.left{
  background:#dcebff;
  border:2px solid #58a7f5;
}

.preset.center{
  background:#dff6e6;
  border:2px solid #42b86b;
}

.preset.right{
  background:#ffe0e0;
  border:2px solid #ef6262;
}

/* =========================
   PRESET ICONS
========================= */

.preset-icon{
  width:30px;
  height:30px;
  flex:0 0 30px;
  display:grid;
  place-items:center;
}

.preset-icon img{
  width:34px;
  height:34px;
  object-fit:contain;
}

.preset-icon svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.preset-text{
  min-width:0;
  flex:1;
}

.preset-name{
  display:block;
  font-size:14px;
  line-height:1.12;
  font-weight:800;
}

.number{
  display:block;
  margin-top:4px;
  color:#4d5968;
  font-size:11px;
  line-height:1;
  font-weight:550;
}

/* =========================
   OLD CAMERA BUTTONS
   NO LEFT/CENTER/RIGHT LABELS
========================= */

.old-presets{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  align-items:start;
}

.old-presets .preset{
  min-height:76px;
}

/* =========================
   STATUS
========================= */

.status{
  min-height:38px;
  margin-top:12px;
  border-radius:10px;
  background:#e9edf2;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#5d6775;
  font-size:14px;
  font-weight:600;
}

.footer{
  text-align:center;
  color:#7a8492;
  font-size:12px;
  margin-top:12px;
}

  }

  .footer{
    display:none;
  }
}

</style>

<script>

/* =====================================================
   CAMERA SETTINGS
===================================================== */

const cameras = {

  new: {
    ip:"192.168.10.30",
    status:"new-status",
    online:"new-online"
  },

  old: {
    ip:"192.168.10.28",
    status:"old-status",
    online:"old-online"
  }

};


/* =====================================================
   PREVIEW FEEDS
===================================================== */

const previewFeeds = {

  new: {
    ip:"192.168.10.30",
    element:"new-preview"
  },

  old: {
    ip:"192.168.10.28",
    element:"old-preview"
  }

};


/* =====================================================
   ONLINE / OFFLINE STATUS
===================================================== */

function setOnline(which,isOnline){

  const el =
    document.getElementById(
      cameras[which].online
    );

  el.classList.toggle(
    "offline",
    !isOnline
  );

  el.querySelector(
    "span:last-child"
  ).textContent =
    isOnline
      ? "Online"
      : "Offline";

}


/* =====================================================
   CAMERA PREVIEW
===================================================== */

function refreshPreview(which){

  const feed =
    previewFeeds[which];

  const img =
    document.getElementById(
      feed.element
    );

  const test =
    new Image();


  test.onload = () => {

    setOnline(
      which,
      true
    );

    img.src =
      test.src;

  };


  test.onerror = () => {

    setOnline(
      which,
      false
    );

  };


  test.src =
    `http://${feed.ip}/cgi-bin/camera?resolution=640x360&quality=standard&${Date.now()}`;

}


/* =====================================================
   START PREVIEWS
===================================================== */

function startPreviews(){

  Object.keys(previewFeeds)
    .forEach(which => {

      refreshPreview(which);

      setInterval(
        () => refreshPreview(which),
        1000
      );

    });

}

startPreviews();


/* =====================================================
   RECALL PTZ PRESET
===================================================== */

function recall(which,n){

  const cam =
    cameras[which];

  const code =
    String(n - 1)
      .padStart(2,"0");

  const url =
    `http://${cam.ip}/cgi-bin/aw_ptz?cmd=%23R${code}&res=1`;


  document.getElementById(
    cam.status
  ).textContent =
    `Calling preset ${n}...`;


  const img =
    new Image();


  img.onload = () => {

    document.getElementById(
      cam.status
    ).textContent =
      `Preset ${n} sent.`;

  };


  img.onerror = () => {

    document.getElementById(
      cam.status
    ).textContent =
      `Preset ${n} sent.`;

  };


  img.src =
    url + `&t=${Date.now()}`;

}

</script>
