<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Church Cameras">

<meta name="theme-color" content="#111111">

<title>Church Cameras</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:60px 16px 16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f2;color:#222}
.app{max-width:950px;margin:auto}
h1{text-align:center;font-size:30px;margin:0 0 18px}
.camera{background:#fff;border-radius:18px;padding:16px;margin-bottom:18px;box-shadow:0 2px 9px rgba(0,0,0,.10)}
.camera h2{text-align:center;margin:0 0 3px;font-size:25px}
.ip{text-align:center;color:#666;font-size:14px;margin-bottom:15px}
.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.column{display:flex;flex-direction:column;gap:12px}
.preset{border:0;border-radius:15px;background:#f8f8f8;color:#111;font-size:19px;font-weight:700;min-height:88px;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer;padding:12px}
.preset:active{transform:scale(.98)}
.number{display:block;font-size:13px;color:#777;font-weight:500;margin-top:6px}
.status{text-align:center;min-height:21px;margin-top:12px;color:#666;font-size:14px}
.footer{text-align:center;color:#777;font-size:13px;margin-top:8px}

.preview-wrap{margin:0 auto 14px;max-width:720px;background:#111;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.preview{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#111}
.preview-note{text-align:center;color:#777;font-size:12px;margin-top:6px}
@media(max-width:600px){
body{padding:10px}
h1{font-size:27px}
.camera{padding:12px}
.camera h2{font-size:22px}
.columns{gap:7px}
.column{gap:7px}
.preset{font-size:15px;min-height:82px;padding:7px}
.number{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
<h1>Church Cameras</h1>

<section class="camera">
<h2>New Church Camera</h2>
<div class="ip">192.168.10.30</div>
<div class="preview-wrap">
  <img class="preview" id="new-preview" alt="New Church Camera live view">
</div>
<div class="preview-note">Live preview</div>

<div class="columns">
  <div class="column">
    <button class="preset" onclick="recall('new',10)">Left Altar<span class="number">Preset 10</span></button>
    <button class="preset" onclick="recall('new',16)">Left Altar Gospel<span class="number">Preset 16</span></button>
    <button class="preset" onclick="recall('new',13)">Left Altar Sermon<span class="number">Preset 13</span></button>
  </div>
  <div class="column">
    <button class="preset" onclick="recall('new',5)">Main Altar<span class="number">Preset 5</span></button>
    <button class="preset" onclick="recall('new',9)">Main Gospel<span class="number">Preset 9</span></button>
    <button class="preset" onclick="recall('new',1)">Main Altar Sermon<span class="number">Preset 1</span></button>
  </div>
  <div class="column">
    <button class="preset" onclick="recall('new',11)">Right Altar<span class="number">Preset 11</span></button>
  </div>
</div>
<div id="new-status" class="status">Ready</div>
</section>

<section class="camera">
<h2>Old Church Camera</h2>
<div class="ip">192.168.10.28</div>
<div class="preview-wrap">
  <img class="preview" id="old-preview" alt="Old Church Camera live view">
</div>
<div class="preview-note">Live preview</div>
<div class="columns">
  <div class="column">
    <button class="preset" onclick="recall('old',4)">Main<span class="number">Preset 4</span></button>
  </div>
  <div class="column">
    <button class="preset" onclick="recall('old',9)">Gospel<span class="number">Preset 9</span></button>
  </div>
  <div class="column">
    <button class="preset" onclick="recall('old',1)">Sermon<span class="number">Preset 1</span></button>
  </div>
</div>
<div id="old-status" class="status">Ready</div>
</section>

<div class="footer">Panasonic PTZ Camera Control</div>
</div>

<script>
const cameras={new:{ip:"192.168.10.30",status:"new-status"},old:{ip:"192.168.10.28",status:"old-status"}};

const previewFeeds={
  new:{ip:"192.168.10.30",element:"new-preview"},
  old:{ip:"192.168.10.28",element:"old-preview"}
};

// Try the Panasonic JPEG endpoint and refresh it periodically.
// The exact JPEG path can vary by firmware; if this model exposes it,
// the image will update automatically.
function refreshPreview(which){
  const feed=previewFeeds[which];
  const img=document.getElementById(feed.element);
  img.src=`http://${feed.ip}/cgi-bin/camera?resolution=640x360&quality=standard&${Date.now()}`;
}
function startPreviews(){
  Object.keys(previewFeeds).forEach(which=>{
    refreshPreview(which);
    setInterval(()=>refreshPreview(which),1000);
  });
}
startPreviews();

function recall(which,n){
 const cam=cameras[which];
 const code=String(n-1).padStart(2,"0");
 const url=`http://${cam.ip}/cgi-bin/aw_ptz?cmd=%23R${code}&res=1`;
 document.getElementById(cam.status).textContent=`Calling preset ${n}...`;
 const img=new Image();
 img.onload=()=>document.getElementById(cam.status).textContent=`Preset ${n} sent.`;
 img.onerror=()=>document.getElementById(cam.status).textContent=`Preset ${n} sent.`;
 img.src=url+`&t=${Date.now()}`;
}
</script>
</body>
</html>
